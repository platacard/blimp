name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Swift version
      id: swift
      run: echo "version=$(swift --version 2>&1 | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

    - name: Cache SwiftPM checkouts and build products
      uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-

    - name: Build
      run: swift build --build-tests

    - name: Run tests
      run: swift test --skip-build
