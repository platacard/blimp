name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
        if: matrix.language == 'swift'

      - name: Swift version
        if: matrix.language == 'swift'
        id: swift
        run: echo "version=$(swift --version 2>&1 | grep -oE 'Swift version [0-9.]+' | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM checkouts and build products
        if: matrix.language == 'swift'
        uses: actions/cache@v4
        with:
          path: .build
          key: codeql-spm-v2-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            codeql-spm-v2-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            codeql-spm-v2-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Fixed so the traced build's environment does not vary with runner size.
          ram: 6144
          threads: 3

      # Dependency manifests recompile under the tracer on every run: SwiftPM
      # keys its manifest cache on the environment, and the tracer library sets
      # a per-process CODEQL_PARENT_ID inside every traced process. Nothing
      # above swift-build can make that stable; the cost is accepted.
      # CodeQL only sees what the traced build compiles. Pull requests
      # recompile what the change touches; pushes to main and the weekly run
      # recompile everything. A change with no Swift in it still extracts one
      # small module so the analysis has a database.
      # Dependency manifests recompile under the tracer on every run: SwiftPM
      # keys its manifest cache on the environment, and the tracer library sets
      # a per-process CODEQL_PARENT_ID inside every traced process. Nothing
      # above swift-build can make that stable; the cost is accepted.
      # CodeQL only sees what the traced build compiles. Pull requests
      # recompile what the change touches; pushes to main and the weekly run
      # recompile everything. A change with no Swift in it still extracts one
      # small module so the analysis has a database.
      - name: Traced process environment (diagnostic)
        if: matrix.language == 'swift'
        run: |
          .github/scripts/stable-env.sh /opt/homebrew/bin/python3 -c 'import os; [print(f"{k}={v}") for k,v in sorted(os.environ.items())]' | sed 's/^/traced1 /'
          .github/scripts/stable-env.sh /opt/homebrew/bin/python3 -c 'import os; [print(f"{k}={v}") for k,v in sorted(os.environ.items())]' | sed 's/^/traced2 /'

      - name: Build
        if: matrix.language == 'swift'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=AMR "${{ github.event.pull_request.base.sha }}...HEAD" -- Sources)
            if [ -n "$changed" ]; then
              echo "$changed" | while IFS= read -r f; do [ -e "$f" ] && touch "$f"; done
            else
              find Sources/Core/ASCCredentials -name '*.swift' -exec touch {} +
            fi
          else
            find Sources -name '*.swift' -exec touch {} +
          fi
          .github/scripts/stable-env.sh "$(xcrun --find swift-build)" --manifest-cache local

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
