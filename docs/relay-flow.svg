<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="770" viewBox="0 0 1580 770" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1580" height="770" fill="#FFFFFF"/><rect x="30" y="30" width="380" height="560" rx="14" fill="#F3F4F6" stroke="#E5E7EB"/><text x="220.0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="0.4">YOUR CI · UPLOAD JOB</text><rect x="430" y="30" width="290" height="560" rx="14" fill="#F3F4F6" stroke="#E5E7EB"/><text x="575.0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="0.4">APP STORE CONNECT</text><rect x="740" y="30" width="400" height="560" rx="14" fill="#F3F4F6" stroke="#E5E7EB"/><text x="940.0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="0.4">BLIMP-RELAY</text><rect x="1160" y="30" width="360" height="560" rx="14" fill="#F3F4F6" stroke="#E5E7EB"/><text x="1340.0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="0.4">YOUR CI · TRIGGERED PIPELINE</text><rect x="75.0" y="91.0" width="290" height="58" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="220.0" y="114.8" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1F2937">blimp approach  /  Approach.start</text><text x="220.0" y="135.8" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1F2937">returns the ASC uploadId</text><path d="M220.0,149 L220.0,196" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="45.0" y="203.0" width="350" height="94" rx="10" fill="#2E7D32" stroke="#2E7D32" stroke-width="1.5"/><text x="220.0" y="226.1" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">store pending state under the uploadId</text><text x="220.0" y="245.1" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">base64 JSON, at least a &quot;branch&quot; field</text><text x="220.0" y="264.1" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">any store with a per-key atomic delete</text><text x="220.0" y="283.1" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">one entry per upload</text><path d="M220.0,297 L220.0,344" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120.0" y="350.0" width="200" height="44" rx="10" fill="#6B7280" stroke="#6B7280" stroke-width="1.5"/><text x="220.0" y="377.2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">exit the job</text><rect x="445.0" y="203.0" width="260" height="94" rx="10" fill="#1565C0" stroke="#1565C0" stroke-width="1.5"/><text x="575.0" y="224.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">process the build, then POST</text><text x="575.0" y="244.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">BUILD_UPLOAD_STATE_UPDATED</text><text x="575.0" y="264.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">x-apple-signature:</text><text x="575.0" y="284.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">hmacsha256=&lt;hex&gt;</text><path d="M395.0,250 L445.0,250" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760.0" y="82.0" width="360" height="76" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/><text x="940.0" y="104.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937">POST /webhooks/appstoreconnect</text><text x="940.0" y="124.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937">body ≤ 1 MiB · HMAC-SHA256 over raw body</text><text x="940.0" y="144.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937">ASC_WEBHOOK_SECRET, optional _SECONDARY</text><path d="M705.0,250 L760.0,250" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760.0" y="212.0" width="360" height="76" rx="10" fill="#EF6C00" stroke="#EF6C00" stroke-width="1.5"/><text x="940.0" y="234.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">buildUploadStateUpdated · COMPLETE | FAILED</text><text x="940.0" y="254.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">PendingStateStore: get → delete = claim</text><text x="940.0" y="274.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">redeliveries lose the claim, answer 200</text><path d="M940.0,158 L940.0,212" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M940.0,288 L940.0,340" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760.0" y="346.0" width="360" height="76" rx="10" fill="#EF6C00" stroke="#EF6C00" stroke-width="1.5"/><text x="940.0" y="368.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">PipelineTrigger: start a run on &quot;branch&quot;</text><text x="940.0" y="388.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">TESTFLIGHT_FINALIZE=true · TF_UPLOAD_STATE</text><text x="940.0" y="408.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">TF_STATE (the blob) + EXTRA_TRIGGER_VARIABLES</text><path d="M940.0,422 L940.0,474" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="760.0" y="481.0" width="360" height="62" rx="10" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="1.5"/><text x="940.0" y="506.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">trigger failed → restore state, alert, 500</text><text x="940.0" y="526.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Apple redelivers · 401 bad signature · 413 too large</text><rect x="1180.0" y="346.0" width="320" height="76" rx="10" fill="#2E7D32" stroke="#2E7D32" stroke-width="1.5"/><text x="1340.0" y="368.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">finalize job</text><text x="1340.0" y="388.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">decode TF_STATE → blimp land</text><text x="1340.0" y="408.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">beta groups · review · changelog</text><path d="M1120.0,384 L1180.0,384" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1180.0" y="481.0" width="320" height="62" rx="10" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="1.5"/><text x="1340.0" y="506.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">safety net: scheduled sweep</text><text x="1340.0" y="526.9" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">claims entries older than N min, finalizes</text><path d="M1340.0,481 L1340.0,422" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1358.0" y="432.5" width="76" height="18" rx="4" fill="#FFFFFF"/><text x="1396.0" y="446.5" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280">fallback</text><rect x="30" y="612" width="1520" height="132" rx="12" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/><text x="50" y="640" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.4">PROVIDERS</text><text x="150" y="640" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1F2937">GitLab (shipped): store = generic package packages/generic/&lt;PENDING_PACKAGE_NAME&gt;/&lt;uploadId&gt;/state.json, claim = DELETE package · trigger = pipeline trigger token</text><text x="150" y="666" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1F2937">GitHub (port): store = git ref refs/tf-pending/&lt;uploadId&gt; pointing at the blob, claim = DELETE ref · trigger = repository_dispatch with client_payload</text><text x="50" y="692" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.4">RELAY ENV</text><text x="150" y="692" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1F2937">ASC_WEBHOOK_SECRET [_SECONDARY]   SINKS=log,gitlab-pipeline-trigger   GITLAB_BASE_URL   GITLAB_PROJECT_ID   PENDING_PACKAGE_NAME=tf-pending</text><text x="150" y="718" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1F2937">GITLAB_API_TOKEN (read + delete)   GITLAB_TRIGGER_TOKEN   ALERT_WEBHOOK_URL   EXTRA_TRIGGER_VARIABLES   PORT=13100   LOG_LEVEL</text></svg>